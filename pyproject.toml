[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "limos"
version = "0.1.0"
description = "A purchasing agent for professional kitchens."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "httpx",
    "google-genai",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy"]

[tool.hatch.build.targets.wheel]
packages = ["gateway", "agent", "mcp_server"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["gateway", "agent", "mcp_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
